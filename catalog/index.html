<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ИльЯкласс — Каталог викторин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366F1'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-weight='800'>Q</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a14;color:#e8e8f0;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:#6366F1;color:#fff}

.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:.08}
.bg-orbs .orb:nth-child(1){width:600px;height:600px;top:-200px;left:-100px;background:#6366F1;animation:orbFloat 22s ease-in-out infinite}
.bg-orbs .orb:nth-child(2){width:500px;height:500px;bottom:-150px;right:-80px;background:#10B981;animation:orbFloat 28s ease-in-out infinite reverse}
.bg-orbs .orb:nth-child(3){width:400px;height:400px;top:40%;left:50%;background:#818CF8;animation:orbFloat 20s ease-in-out infinite 4s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-70px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.9)}}

nav{position:sticky;top:0;z-index:100;padding:0 24px;background:rgba(10,10,20,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#e8e8f0;cursor:pointer;text-decoration:none}
.nav-logo svg{width:22px;height:22px;color:#6366F1}
.nav-stats{font-size:12px;color:#7878a0;display:flex;gap:16px}

.catalog-header{max-width:1100px;margin:0 auto;padding:48px 24px 0}
.catalog-header h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:8px}
.catalog-header h1 span{background:linear-gradient(135deg,#6366F1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.catalog-header p{color:#7878a0;font-size:15px;max-width:500px}

.filters{max-width:1100px;margin:28px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{width:100%;padding:11px 16px 11px 40px;background:#16162a;border:1px solid rgba(255,255,255,.06);border-radius:10px;color:#e8e8f0;font-size:14px;font-family:inherit;transition:border-color .2s}
.search-box input:focus{outline:none;border-color:#6366F1}
.search-box input::placeholder{color:#585880}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#585880}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:transparent;color:#7878a0;transition:all .2s;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.12);color:#e8e8f0}
.chip.active{background:#6366F1;color:#fff;border-color:#6366F1}
.format-chips{display:flex;gap:6px;margin-left:auto}
.fmt{padding:7px 14px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:transparent;color:#7878a0;transition:all .2s;font-family:inherit}
.fmt:hover{border-color:rgba(255,255,255,.12);color:#e8e8f0}
.fmt.active{border-color:#6366F1;color:#6366F1;background:rgba(99,102,241,.1)}

.grid{max-width:1100px;margin:28px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:24px;transition:all .25s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;overflow:hidden}
.card:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-emoji{font-size:36px;line-height:1}
.card-fav{background:none;border:none;cursor:pointer;font-size:18px;color:#585880;transition:color .2s;padding:0}
.card-fav:hover,.card-fav.active{color:#e74c3c}
.card h3{font-size:17px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.card-desc{font-size:13px;color:#7878a0;line-height:1.45;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.3px}
.tag-quiz{background:rgba(99,102,241,.15);color:#a5b4fc}
.tag-tf{background:rgba(16,185,129,.15);color:#6ee7b7}
.tag-test{background:rgba(245,158,11,.15);color:#fcd34d}
.tag-cat{background:rgba(255,255,255,.06);color:#7878a0}
.card-actions{display:flex;gap:8px}
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-play{background:#6366F1;color:#fff;flex:1;justify-content:center}
.btn-play:hover{background:#5558e6;box-shadow:0 4px 20px rgba(99,102,241,.2)}
.btn-preview{background:rgba(255,255,255,.06);color:#7878a0;border:1px solid rgba(255,255,255,.06)}
.btn-preview:hover{background:rgba(255,255,255,.1);color:#e8e8f0}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:#7878a0}
.empty-state .icon{font-size:48px;margin-bottom:12px}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.player{width:100%;max-width:560px;max-height:90vh;background:#12121e;border:1px solid rgba(255,255,255,.06);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.player-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.player-header h3{font-size:15px;font-weight:600}
.player-header .close{background:none;border:none;color:#7878a0;cursor:pointer;font-size:20px;padding:4px 8px;transition:color .2s}
.player-header .close:hover{color:#e8e8f0}
.player-body{padding:24px 20px;overflow-y:auto;flex:1}

.lobby{text-align:center}
.lobby .big-emoji{font-size:56px;margin-bottom:8px}
.lobby h2{font-size:22px;font-weight:700;margin-bottom:4px}
.lobby .sub{color:#7878a0;font-size:13px;margin-bottom:20px}
.lobby .info{display:flex;gap:16px;justify-content:center;margin-bottom:24px}
.lobby .info-item{text-align:center}
.lobby .info-item .num{font-size:28px;font-weight:800;color:#6366F1}
.lobby .info-item .label{font-size:11px;color:#585880;text-transform:uppercase;letter-spacing:.5px}
.lobby .start-btn{width:100%;padding:16px;font-size:16px;font-weight:700;background:#6366F1;color:#fff;border:none;border-radius:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.lobby .start-btn:hover{background:#5558e6;box-shadow:0 6px 24px rgba(99,102,241,.2)}

.q-screen{display:none}
.q-screen.active{display:block}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-num{font-size:12px;color:#585880;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.q-timer{font-size:13px;font-weight:700;color:#6366F1;font-variant-numeric:tabular-nums}
.q-timer.urgent{color:#e74c3c;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.q-timer-bar{width:100%;height:5px;background:#16162a;border-radius:3px;margin-bottom:16px;overflow:hidden}
.q-timer-fill{height:100%;background:#6366F1;border-radius:3px;transition:width 1s linear}
.q-timer-fill.urgent{background:#e74c3c}
.q-text{font-size:clamp(17px,2.5vw,21px);font-weight:700;text-align:center;line-height:1.35;margin-bottom:20px;letter-spacing:-.3px}
.q-answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-answers.tf{grid-template-columns:1fr 1fr}
.ans-btn{padding:16px 12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;min-height:76px;font-family:inherit;box-shadow:0 4px 16px rgba(0,0,0,.25);position:relative;overflow:hidden}
.ans-btn:active{transform:scale(.95)}
.ans-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.ans-btn .shape{font-size:22px}
.ans-btn .text{font-size:13px;text-align:center;line-height:1.3}
.ans-btn.selected{box-shadow:0 0 0 3px #fff,0 4px 20px rgba(0,0,0,.3)!important}
.ans-btn.correct{box-shadow:0 0 0 3px #22c55e,0 0 24px rgba(34,197,94,.2)!important;opacity:1!important}
.ans-btn.wrong{box-shadow:0 0 0 3px #e74c3c,0 0 20px rgba(231,76,60,.2)!important;opacity:1!important}
.q-nav{display:flex;gap:8px;margin-top:16px}
.q-nav .btn{flex:1;justify-content:center;padding:12px}
.btn-next{background:#6366F1;color:#fff}
.btn-next:hover{background:#5558e6}
.btn-prev{background:rgba(255,255,255,.06);color:#7878a0;border:1px solid rgba(255,255,255,.06)}
.btn-prev:hover{background:rgba(255,255,255,.1);color:#e8e8f0}
.btn-submit{background:#10B981;color:#fff;width:100%;margin-top:12px;padding:14px;font-size:15px;justify-content:center}
.btn-submit:hover{box-shadow:0 4px 20px rgba(16,185,129,.2)}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}

.result-screen{text-align:center;display:none}
.result-screen.active{display:block}
.result-icon{font-size:56px;margin-bottom:8px}
.result-title{font-size:22px;font-weight:700;margin-bottom:4px}
.result-points{font-size:40px;font-weight:900;color:#10B981;margin-bottom:4px}
.result-sub{color:#7878a0;font-size:13px;margin-bottom:20px}
.result-list{text-align:left;display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-height:240px;overflow-y:auto}
.result-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#16162a;border-radius:8px;font-size:13px}
.result-row .icon{font-size:16px;flex-shrink:0}
.result-row .q{flex:1;color:#7878a0}
.result-row .a{font-weight:600}
.result-row .a.ok{color:#22c55e}
.result-row .a.bad{color:#e74c3c}
.btn-restart{width:100%;padding:14px;background:#6366F1;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-restart:hover{background:#5558e6}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .filters{flex-direction:column}
  .format-chips{margin-left:0}
  .q-answers{grid-template-columns:1fr}
  .ans-btn{min-height:60px}
}
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>

<nav>
<div class="nav-inner">
  <a href="#" class="nav-logo" onclick="location.reload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    ИльЯкласс
  </a>
  <div class="nav-stats">
    <span id="totalCount"></span>
    <span id="favCount"></span>
  </div>
</div>
</nav>

<div class="catalog-header">
  <h1>Каталог <span>викторин</span></h1>
  <p>Выберите викторину и играйте прямо в браузере. Учебные вопросы по школьным предметам.</p>
</div>

<div class="filters">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Поиск по названию...">
  </div>
  <div class="filter-chips" id="catChips"></div>
  <div class="format-chips" id="fmtChips"></div>
</div>

<div class="grid" id="quizGrid"></div>

<div class="overlay" id="overlay">
<div class="player" id="player">
  <div class="player-header">
    <h3 id="playerTitle"></h3>
    <button class="close" onclick="closePlayer()">&times;</button>
  </div>
  <div class="player-body" id="playerBody"></div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
